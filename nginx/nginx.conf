# "api" is a Compose service with 2 replicas; Docker DNS returns both addresses and
# nginx spreads requests across them round-robin.
upstream api {
    server api:3000;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have hashed names, so browsers may keep them for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Any other address is a client-side route handled by React Router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
